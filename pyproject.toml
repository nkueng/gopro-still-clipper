[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gopro-still-clipper"
version = "0.1.0"
description = "Extract surfing clips from GoPro footage using YOLOv8 person detection"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "opencv-python>=4.9",
    "ultralytics>=8.2",
    "numpy>=1.26",
]

[project.scripts]
gopro-still-clipper = "gopro_still_clipper.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gopro_still_clipper*"]

[tool.setuptools.package-data]
gopro_still_clipper = ["static/*"]
